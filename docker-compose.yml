# Day 4: local test of the full VM deployment (no Redis - see ADR-004).
# Everything points at the REAL cloud database and bucket through .env.
# The two ingestion services run once and exit (as cron does on the VM); the dashboard stays up.
# Day 2's queue-based stack is kept in docker-compose.day2.yml.
name: airbreda

services:
  air-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    restart: "no"

  traffic-ingest:
    build:
      context: .
      dockerfile: Dockerfile.traffic
    env_file: .env
    restart: "no"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file: .env
    ports:
      - "8000:8000"

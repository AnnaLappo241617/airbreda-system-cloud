name: airbreda
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [airbreda]
    healthcheck:                      # lets the other services wait until Redis is actually ready
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  air-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: air-ingest
    env_file: .env
    environment: {RUN_MODE: loop, QUEUE_ENABLED: "1"}
    ports: ["8080:8000"]              # /health -> http://localhost:8080/health
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [airbreda]

  traffic-ingest:
    build:
      context: .
      dockerfile: Dockerfile.traffic
    container_name: traffic-ingest
    env_file: .env
    environment: {RUN_MODE: loop, QUEUE_ENABLED: "1"}
    ports: ["8081:8000"]              # /health -> http://localhost:8081/health
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [airbreda]

networks:
  airbreda:
